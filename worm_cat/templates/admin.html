{% extends "layout.html" %}
{% block body %}
    {% set user = session.get('user') %}
    {% if user and user['user_name']=='awalker'%}

    <style>
        .glyphicon-refresh-animate {
            -animation: spin .7s infinite linear;
            -webkit-animation: spin2 .7s infinite linear;
        }

        @-webkit-keyframes spin2 {
            from { -webkit-transform: rotate(0deg);}
            to { -webkit-transform: rotate(360deg);}
        }

        @keyframes spin {
            from { transform: scale(1) rotate(0deg);}
            to { transform: scale(1) rotate(360deg);}
        }

        .droparea {
            border-style: dashed;
            border-width: 1px;
            border-color: grey;
            line-height: 50px;
            text-align: center;
            margin-bottom: 5px;
        }

        .droppedarea {
            border-style: solid;
            border-width: 1px;
            border-color: gray;
            line-height: 50px;
            text-align: center;
            margin-bottom: 5px;
        }

    </style>

          <div class="container">
               <div class="row">

                    <div class="col-md-7 col-sm-7  vertical-center">

                         <form id="admin-cat-form" name="admin-cat-form" role="form" method="post">
                            {% if error %}<p class=error><strong>Error:</strong> {{ error }}</p>{% endif %}
                            {{ form.hidden_tag() }}

                              <!-- SECTION TITLE -->
                              <div class="section-title wow fadeInUp" data-wow-delay="0.4s">
                                   <h3>Admin</h3>
                              </div>

                              <div class="wow fadeInUp" data-wow-delay="0.8s">


                                   <div id="submit_btn" style="display:block;" class="col-md-12 col-sm-12">
                                       <button type="submit" id="cf-submit" class="form-control btn-primary">Clean Up</button>

                                   </div>
                                  <div id="processing" style="display:none;" class="col-md-12 col-sm-12">
                                      <label class="form-control btn btn-sm btn-warning"><span class="glyphicon glyphicon-refresh glyphicon-refresh-animate"></span> Processing...</label>

                                   </div>

                              </div>
                        </form>
                    </div>

               </div>
          </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js" type="text/javascript"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.3.14/angular.min.js"></script>
    <script src="../static/js/fileupload.js"></script>

    <script>
        $('form').submit(function(){
          $('#processing').toggle();
          $('#submit_btn').toggle();
        return true;
    });
    </script>
    {% endif %}
{% endblock %}
