[project]
name = "worm-cat-web"
version = "0.1.0"
description = "WormCat web application and batch processing"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "amqp>=2.5.2",
    "billiard>=3.6.3.0",
    "celery[redis]>=5.4.0",
    "click>=7.1.2",
    "Flask>=2.0.0",
    "Flask-WTF>=0.14.3",
    "gevent>=23.9.1",
    "greenlet>=3.0.0",
    "gunicorn>=20.0.4",
    "importlib-metadata",
    "itsdangerous>=2.0.0",
    "Jinja2>=3.0.0",
    "kombu>=4.6.8",
    "MarkupSafe>=2.0.0",
    "numpy>=1.22.0",
    "openpyxl==3.1.5",
    "pandas>=1.5.0",
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "python-dateutil>=2.8.1",
    "python-dotenv>=1.0.0",
    "pytz",
    "redis>=5.0.0",
    "ruff>=0.4.0",
    "six>=1.15.0",
    "vine>=1.3.0",
    "Werkzeug>=2.0.0",
    "WTForms>=2.3.1",
    "xlrd>=1.2.0",
    "XlsxWriter>=1.2.8",
    "zipp",
    "zope-event",
    "zope-interface",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "worm_cat"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]


